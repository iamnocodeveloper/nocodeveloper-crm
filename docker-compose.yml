# ============================================================
# Nocodeveloper CRM — app + Postgres + Caddy (HTTPS automático)
# Uso:        cp .env.example .env  →  rellenar  →  docker compose up -d --build
# Actualizar: git pull  →  docker compose up -d --build
#
# En Easypanel, Coolify o similares no hace falta este archivo: basta con
# construir el Dockerfile y darle las variables de .env.example.
# ============================================================
services:
  app:
    image: ghcr.io/iamnocodeveloper/nocodeveloper-crm:${NOCODEVELOPER_CRM_VERSION:-2.0.0}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/nocodeveloper
    volumes:
      # Adjuntos, logo e icono (la imagen trae MEDIA_DIR=/data/media).
      - nocodeveloper_app_data:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nocodeveloper
    volumes:
      - nocodeveloper_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nocodeveloper"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - nocodeveloper_caddy_data:/data
      - nocodeveloper_caddy_config:/config
    depends_on:
      - app

volumes:
  nocodeveloper_pg:
  nocodeveloper_app_data:
  nocodeveloper_caddy_data:
  nocodeveloper_caddy_config:
